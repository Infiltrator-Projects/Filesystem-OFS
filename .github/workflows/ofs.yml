name: OFS independent core, shared object and EFI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ofs-so:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build and run original OFS core, reader and V1/V2 tests
        run: make test
  ofs-efi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install GNU-EFI development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc binutils gnu-efi file
      - name: Build native OFS EFI driver without deploying or touching the ESP
        run: make efi
      - name: Confirm actual firmware artifact
        run: |
          test -s build/uefi/OFS_x64.efi
          file build/uefi/OFS_x64.efi
          sha256sum build/uefi/OFS_x64.efi
