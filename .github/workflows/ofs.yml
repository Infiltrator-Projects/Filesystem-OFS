name: Qualify and publish OFS shared module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-ofs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  ofs-so:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 dpkg-dev cmake libssl-dev busybox-static cpio
      - name: Qualify Common V2 filesystem API and native reader
        run: make check
      - name: Build portable package and source-first native installer
        run: |
          make release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
      - name: Inspect portable package and native source installation result
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          python3 tests/check-package.py dist/*.deb --profile portable
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          bash dist/*.run --help
          bash dist/*.run --profile aggressive --build-only --output build/native-package
          python3 tests/check-package.py build/native-package/*.deb --profile aggressive
          dpkg-deb -x build/native-package/*.deb build/native-payload
      - name: Compare kernel and initramfs bytes through both packaged V2 providers
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ofs-media"
          bash tests/boot-file-fixtures.sh "$work"
          python3 tests/fetch-oracle.py --output "$work/oracle"
          dpkg-deb -x dist/*.deb "$work/portable"
          for root in "$work/portable" build/native-payload; do
            bash tests/test-ofs-media.sh "$root/System/Filesystems/OFS.so" \
              "$work/oracle/amitools-0.8.1" "$work/vmlinuz" "$work/initramfs"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ofs-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: ofs-so
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@v4
        with:
          name: ofs-qualified-${{ github.sha }}
          path: dist
      - name: Publish the independently qualified OFS Common V2 package only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v${version}"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" = 1
          test "$(find dist -type f | wc -l)" = 2
          test "$(find dist -name '*.ko' -o -name '*.efi' | wc -l)" = 0
          mkdir -p build/release-check
          dpkg-deb -x dist/*.deb build/release-check
          test "$(find build/release-check -type f | wc -l)" = 2
          test -s build/release-check/System/Filesystems/OFS.so
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable $tag already exists; no release update required."
            exit 0
          fi
          sha256sum dist/*.deb dist/*.run
          gh release create "$tag" dist/*.deb dist/*.run \
            --target "$GITHUB_SHA" --title "Amiga Original File System ${version}" \
            --notes "One native Common V2 OFS.so with the source-first native installer. No Linux filesystem-specific kernel module or separate EFI filesystem driver is included. Common V2 independent API, source and package qualification passed."
