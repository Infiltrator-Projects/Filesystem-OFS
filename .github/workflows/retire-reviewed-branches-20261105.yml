name: Retire reviewed branches once
"on": create
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: retire-reviewed-branches-20261105
  cancel-in-progress: false
jobs:
  retire:
    if: github.event.ref_type == 'branch' && github.event.ref == 'maintenance/retire-reviewed-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve reviewed tips and retire branches with atomic SHA leases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Archive reviewed branch tips, then remove them with atomic SHA leases."""
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          
          
          def retire(plan):
              token = os.environ["GH_TOKEN"]
              setup = os.environ["GITHUB_SHA"]
              assert os.environ["GITHUB_REPOSITORY"] == plan["repo"]
              assert re.fullmatch(r"[0-9a-f]{40}", setup)
              prefix = "repos/" + plan["repo"] + "/"
          
              def api(path, method="GET", payload=None, missing=False):
                  request = urllib.request.Request(
                      "https://api.github.com/" + path,
                      data=None if payload is None else json.dumps(payload).encode(),
                      method=method,
                      headers={"Authorization": "Bearer " + token,
                               "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28",
                               "User-Agent": "reviewed-branch-retirement"})
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          body = response.read()
                      return json.loads(body) if body else None
                  except urllib.error.HTTPError as error:
                      if error.code == 404 and missing:
                          return None
                      raise
          
              def ref(kind, name, missing=False):
                  return api(prefix + "git/ref/" + kind + "/" +
                             urllib.parse.quote(name, safe="/"), missing=missing)
          
              def sha(kind, name):
                  return ref(kind, name)["object"]["sha"]
          
              def contains(ancestor, descendant):
                  result = api(prefix + "compare/" + ancestor + "..." + descendant)
                  return result["behind_by"] == 0 and result["merge_base_commit"]["sha"] == ancestor
          
              assert api(prefix.rstrip("/"))["default_branch"] == "main"
              assert sha("heads", "main") == setup, "main moved; no branches will be deleted"
              assert sha("heads", plan["trigger"]) == setup
              change = api(prefix + "compare/" + plan["main"] + "..." + setup)
              assert change["behind_by"] == 0 and change["ahead_by"] == plan.get("setupCommits", 1)
              assert [item["filename"] for item in change["files"]] == [plan["workflow"]]
              original = api(prefix + "git/commits/" + plan["main"])
              assert original["tree"]["sha"] == plan["tree"]
              open_heads = set()
              for page in range(1, 101):
                  pulls = api(prefix + f"pulls?state=open&per_page=100&page={page}")
                  open_heads.update(item["head"]["ref"] for item in pulls
                                    if item["head"]["repo"] and
                                    item["head"]["repo"]["full_name"] == plan["repo"])
                  if len(pulls) < 100:
                      break
              else:
                  raise RuntimeError("Pull-request pagination exceeded safety bound")
          
              # Complete all provenance and concurrency checks before changing any refs.
              for branch in plan["branches"]:
                  name, tip = branch["branch"], branch["head"]
                  assert name != "main" and name not in open_heads
                  assert sha("heads", name) == tip, "reviewed branch moved"
                  info = api(prefix + "branches/" + urllib.parse.quote(name, safe=""))
                  assert not info["protected"], "reviewed branch became protected"
                  evidence = branch.get("evidenceCommit", tip)
                  assert contains(evidence, plan["main"]), "work is not retained in main"
                  if evidence != tip:
                      old = api(prefix + "git/commits/" + tip)
                      retained = api(prefix + "git/commits/" + evidence)
                      assert old["tree"]["sha"] == retained["tree"]["sha"] == branch["evidenceTree"]
          
              for branch in plan["branches"]:
                  tag = "archive/2026-11-05/branch-retirement/" + re.sub(
                      r"[^A-Za-z0-9._-]+", "-", branch["branch"]) + "-" + branch["head"][:12]
                  archived = ref("tags", tag, missing=True)
                  if archived is None:
                      api(prefix + "git/refs", "POST", {"ref": "refs/tags/" + tag, "sha": branch["head"]})
                  assert sha("tags", tag) == branch["head"], "archive tag mismatch"
                  print("ARCHIVED", branch["branch"], branch["head"], tag, flush=True)
          
              assert sha("heads", "main") == setup, "main moved before retirement"
              leases = [(item["branch"], item["head"]) for item in plan["branches"]]
              leases.extend((item["branch"], item["head"]) for item in plan.get("temporaryBranches", []))
              leases.append((plan["trigger"], setup))
              for name, tip in leases:
                  assert name != "main"
                  assert sha("heads", name) == tip, "branch moved before retirement"
              # Git's receive transaction enforces the expected SHAs atomically. A
              # concurrent branch update makes the whole deletion transaction fail.
              environment = dict(os.environ)
              authorization = base64.b64encode(("x-access-token:" + token).encode()).decode()
              environment.update(GIT_CONFIG_COUNT="1",
                                 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                                 GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + authorization,
                                 GIT_TERMINAL_PROMPT="0")
              with tempfile.TemporaryDirectory() as work:
                  subprocess.run(["git", "init", "--bare", "--quiet", work], check=True)
                  subprocess.run(["git", "-C", work, "push", "--atomic",
                                  *["--force-with-lease=refs/heads/" + name + ":" + tip for name, tip in leases],
                                  "https://github.com/" + plan["repo"] + ".git",
                                  *[":refs/heads/" + name for name, _ in leases]],
                                 env=environment, check=True)
              branches = api(prefix + "branches?per_page=100")
              assert [item["name"] for item in branches] == ["main"], "unexpected branches remain"
              print("SINGLE-MAIN-VERIFIED", plan["repo"], "archived", len(plan["branches"]), flush=True)
          
          retire(json.loads("{\"repo\":\"Infiltrator-Projects/Filesystem-OFS\",\"main\":\"f41690d3247d37534f713a4a9ce9746c954dca84\",\"tree\":\"d48abbd3c04c3d0fdec2dfaa4e4071b8e98ca051\",\"workflow\":\".github/workflows/retire-reviewed-branches-20261105.yml\",\"trigger\":\"maintenance/retire-reviewed-20261105\",\"branches\":[{\"repo\":\"Infiltrator-Projects/Filesystem-OFS\",\"link_id\":\"link_6aa9eb29612c8191b65880594e38ee41\",\"branch\":\"fix/native-installer-fixture-io-0.1.9\",\"head\":\"935b8d986ff8ef791d801985b9cd9dd00e6b7358\",\"protected\":false,\"main\":\"f41690d3247d37534f713a4a9ce9746c954dca84\",\"status\":\"ahead\",\"ahead\":1,\"behind\":0,\"mergeBase\":\"935b8d986ff8ef791d801985b9cd9dd00e6b7358\"}]}"))
          PY
